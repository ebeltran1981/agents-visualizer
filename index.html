<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agents Visualizer</title>
<style>
  :root {
    --bg: #0b0d0c; --panel: #121513; --line: #232823; --text: #d7ded6; --dim: #7c867b;
    --lime: #b6f36a; --cyan: #6ad8f3; --amber: #f3c76a; --pink: #f36ad8; --red: #f36a6a;
    font: 13px/1.45 ui-monospace, "JetBrains Mono", "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); padding: 20px 24px 64px; }
  header { display: flex; justify-content: space-between; align-items: end; gap: 16px; margin-bottom: 18px; }
  h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -.5px; }
  h1 b { color: var(--lime); }
  .sub, .dim { color: var(--dim); }
  select { background: var(--panel); color: var(--text); border: 1px solid var(--line); padding: 6px; font: inherit; max-width: 420px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--dim); margin: 24px 0 8px; font-weight: 500; }
  .row { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .row > *, .grid > * { min-width: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--c, var(--lime)); padding: 12px 14px;
          transition: border-color .4s, box-shadow .4s, opacity .4s; min-width: 0; }
  .card[data-state=working] { box-shadow: 0 0 0 1px var(--c, var(--lime)), 0 0 18px -6px var(--c, var(--lime)); }
  .card[data-state=idle], .card[data-state=done] { opacity: .72; }
  .card[data-state=FAIL] { --c: var(--red); }
  .top { display: flex; justify-content: space-between; gap: 8px; }
  .model { color: var(--c, var(--lime)); font-weight: 600; }
  .badge { font-size: 11px; padding: 1px 7px; border: 1px solid currentColor; border-radius: 9px; transition: color .4s; white-space: nowrap; }
  [data-state=working] .badge { color: var(--c, var(--lime)); animation: pulse 1.4s infinite; }
  [data-state=PASS] .badge { color: var(--lime); } [data-state=FAIL] .badge { color: var(--red); }
  [data-state=idle] .badge, [data-state=done] .badge { color: var(--dim); }
  @keyframes pulse { 50% { opacity: .45; } }
  .desc, .act { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .act { margin: 8px 0 6px; } .act i { color: var(--c, var(--lime)); font-style: normal; }
  .stats { display: flex; gap: 14px; flex-wrap: wrap; color: var(--dim); font-size: 12px; }
  .stats b { color: var(--text); font-weight: 500; }
  .dots { letter-spacing: 2px; color: var(--c, var(--lime)); }
  .checks { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; margin-top: 8px; font-size: 12px; }
  .bill { background: var(--panel); border: 1px solid var(--line); padding: 14px; }
  .bar { display: grid; grid-template-columns: 210px 1fr 90px; gap: 10px; align-items: center; margin: 6px 0; }
  .track { height: 14px; background: #1a1e1a; }
  .fill { height: 100%; width: 0; background: var(--lime); transition: width 1.2s cubic-bezier(.2,.8,.2,1); }
  .fill.main { background: var(--dim); }
  .x { color: var(--bg); background: var(--lime); padding: 2px 8px; font-weight: 700; margin-left: 8px; }
  #log { background: var(--panel); border: 1px solid var(--line); height: 300px; overflow-y: auto; padding: 6px 0; }
  .ln { display: grid; grid-template-columns: 70px 150px 110px 1fr; gap: 10px; padding: 1px 12px; animation: in .4s; }
  .ln span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ln.err { color: var(--red); }
  @keyframes in { from { background: #1d2a14; } }
  footer { position: fixed; bottom: 0; left: 0; right: 0; background: #070807; border-top: 1px solid var(--line);
           padding: 8px 24px; display: flex; justify-content: space-between; gap: 16px; color: var(--dim); font-size: 12px; }
  footer span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  footer code { color: var(--lime); }
  .opus { --c: var(--lime); } .sonnet { --c: var(--cyan); } .haiku { --c: var(--amber); } .fable { --c: var(--pink); }
  @media (max-width: 720px) {
    body { padding: 16px 16px 80px; } header { flex-direction: column; align-items: start; }
    .row { grid-template-columns: 1fr; } .bar { grid-template-columns: 1fr; } .ln { grid-template-columns: 60px 1fr; }
    .ln span:nth-child(n+3) { grid-column: 1 / -1; } select { max-width: 100%; }
  }
</style>
</head>
<body>
<header>
  <div><h1 id="title">— models, one session</h1><div class="sub" id="roles">connecting…</div></div>
  <select id="picker"></select>
</header>

<div class="row"><div id="main"></div><div id="advisor"></div></div>
<h2>Subagents</h2>
<div class="grid" id="subs"><div class="dim">no subagents yet</div></div>

<h2>Read bill <span class="dim" id="readTokens"></span></h2>
<div class="bill">
  <div class="bar"><span id="actualLabel">actual</span><div class="track"><div class="fill" id="actualBar"></div></div><b id="actualCost"></b></div>
  <div class="bar"><span id="mainLabel">if on main model</span><div class="track"><div class="fill main" id="mainBar"></div></div><b id="mainCost"></b></div>
  <div class="dim" style="margin-top:6px">session total <b id="total"></b> vs <b id="totalIfMain"></b> if all on main model <span id="ratio"></span> <span id="unpriced"></span></div>
</div>

<h2>Session log</h2>
<div id="log"></div>

<footer><span id="cmd"></span><span id="effortSummary"></span></footer>

<script type="module">
import { createState, ingest, ingestMeta, summary, stateOf, verb, label, family, shortModel, EFFORT, cost, readTokens } from './aggregate.js';

const $ = id => document.getElementById(id);
const fmt$ = n => n == null ? '?' : '$' + (n < 10 ? n.toFixed(2) : n.toFixed(1));
const fmtK = n => n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'k' : String(n);
const time = ts => ts ? new Date(ts).toLocaleTimeString([], { hour12: false }) : '';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => `&#${c.charCodeAt(0)};`);
const dots = e => '●'.repeat(EFFORT[e] ?? 0) + '○'.repeat(5 - (EFFORT[e] ?? 0));

let state, es, dirty = false;

function cardHTML(a, s) {
  const st = stateOf(a), [sym, v] = verb(a);
  const finished = ['done', 'PASS', 'FAIL'].includes(st);
  const act = finished ? `<i>✓</i> <span class="dim">${esc(a.final.split('\n').find(Boolean))}</span>` : a.activity ? `<i>${sym}</i> ${esc(v)} <span class="dim">${esc(a.activity.input)}</span>` : '<span class="dim">waiting…</span>';
  return `<div class="top"><span><span class="model">${esc(shortModel(a.model))}</span> <span class="dim">${esc(label(a))}</span></span><span class="badge">${st}</span></div>
    <div class="desc dim">${esc(a.desc || (a.id === 'main' ? s.cwd : ''))}</div>
    <div class="act">${act}</div>
    <div class="stats"><span class="dots" title="effort ${esc(a.effort)}">${dots(a.effort)}</span>
      <span><b>${a.files.size}</b> files</span><span><b>${a.tools}</b> tools</span>
      <span><b>${fmtK(a.u.out)}</b> out / <b>${fmtK(readTokens(a.u))}</b> in</span>
      <span><b>${fmt$(cost(a.model, a.u))}</b></span>${a.errors ? `<span style="color:var(--red)">${a.errors} err</span>` : ''}</div>`;
}

// Update a keyed card in place so CSS transitions run on state changes.
function upsert(parent, a, s) {
  let el = parent.querySelector(`[data-id="${a.id}"]`);
  if (!el) { el = document.createElement('div'); el.dataset.id = a.id; parent.append(el); }
  el.className = `card ${family(a.model)}`;
  el.dataset.state = stateOf(a);
  const html = cardHTML(a, s);
  if (el._html !== html) el.innerHTML = el._html = html;
}

function render() {
  if (!state) return;
  const s = summary(state);
  $('title').innerHTML = `<b>${s.models.length || '—'}</b> model${s.models.length === 1 ? '' : 's'}, one session`;
  const roles = s.main ? [`${shortModel(s.main.model)} leads`] : [];
  if (s.main?.advisor) roles.push(`${shortModel(s.main.advisor)} advises`);
  const byModel = Object.groupBy(s.subs, a => shortModel(a.model));
  for (const [m, list] of Object.entries(byModel)) roles.push(`${m} runs ${list.length} subagent${list.length > 1 ? 's' : ''}`);
  $('roles').textContent = roles.join(' · ') || 'waiting for transcript…';

  if (s.main) upsert($('main'), s.main, state);
  const adv = s.main?.advisor;
  $('advisor').innerHTML = `<div class="card ${family(adv)}" data-state="${adv ? 'idle' : 'done'}">
    <div class="top"><span><span class="model">${esc(adv ? shortModel(adv) : 'no advisor')}</span> <span class="dim">advisor</span></span>
    <span class="badge">${state.advCalls} calls</span></div>
    <div class="checks"><span>before plan</span><b>${state.checks.plan}</b><span>same error twice</span><b>${state.checks.repeat}</b>
    <span>before done</span><b>${state.checks.done}</b></div>
    <div class="dim" style="font-size:11px;margin-top:6px">checkpoint moments detected in the transcript; advisor calls themselves aren't logged there</div></div>`;

  if (s.subs.length) {
    if (!$('subs').firstElementChild?.dataset.id) $('subs').innerHTML = '';
    s.subs.forEach(a => upsert($('subs'), a, state));
  }

  const max = Math.max(s.readCost, s.readCostIfMain) || 1;
  $('readTokens').textContent = `· ${fmtK(s.readTokens)} tokens read by subagents`;
  $('actualLabel').textContent = `actual (${[...new Set(s.subs.map(a => shortModel(a.model)))].join(', ') || '—'})`;
  $('mainLabel').textContent = `if on ${shortModel(s.mainModel)}`;
  $('actualBar').style.width = (100 * s.readCost / max) + '%';
  $('mainBar').style.width = (100 * s.readCostIfMain / max) + '%';
  $('actualCost').textContent = fmt$(s.readCost);
  $('mainCost').textContent = fmt$(s.readCostIfMain);
  $('total').textContent = fmt$(s.cost);
  $('totalIfMain').textContent = fmt$(s.costIfMain);
  const x = s.readCost ? s.readCostIfMain / s.readCost : 0;
  $('ratio').innerHTML = x ? `<span class="x">${x >= 1.05 ? x.toFixed(1) + 'x less' : 'same price'}</span>` : '';
  $('unpriced').textContent = s.unpriced.length ? `· no price for ${s.unpriced.join(', ')} (TODO in aggregate.js)` : '';

  $('cmd').innerHTML = s.main ? `${esc(state.cwd)} <code>$ claude --model ${esc(s.main.model)} --effort ${esc(s.main.effort)}</code> <span class="dim">(reconstructed)</span>` : '';
  const counts = {};
  s.subs.forEach(a => { const st = stateOf(a); counts[st] = (counts[st] ?? 0) + 1; });
  const efforts = [...new Set(s.subs.map(a => a.effort).filter(Boolean))].join('/');
  $('effortSummary').textContent = `effort main ${s.main?.effort || '—'}${efforts ? ` · subs ${efforts}` : ''} · ${s.subs.length} subagents`
    + (s.subs.length ? ` (${Object.entries(counts).map(([k, v]) => `${v} ${k}`).join(', ')})` : '');
}

function appendLog(rows) {
  const log = $('log'), atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
  for (const r of rows) {
    const el = document.createElement('div');
    el.className = `ln ${r.fam}` + (r.err ? ' err' : '');
    el.innerHTML = `<span class="dim">${time(r.ts)}</span><span class="model">${esc(r.agent)}</span><span>${esc(r.action)}</span><span class="dim">${esc(r.detail)}</span>`;
    log.append(el);
  }
  while (log.children.length > 500) log.firstChild.remove();
  if (atBottom) log.scrollTop = log.scrollHeight;
}

function connect(session) {
  es?.close();
  state = createState();
  ['main', 'advisor', 'log'].forEach(id => $(id).innerHTML = '');
  $('subs').innerHTML = '<div class="dim">no subagents yet</div>';
  es = new EventSource('/events?session=' + encodeURIComponent(session));
  es.onmessage = e => {
    const rows = [];
    for (const ev of JSON.parse(e.data)) ev.meta ? ingestMeta(state, ev.a, ev.meta) : rows.push(...ingest(state, ev.a, ev.r));
    appendLog(rows);
    dirty = true;
  };
  history.replaceState(null, '', '?session=' + encodeURIComponent(session));
}

setInterval(() => { render(); dirty = false; }, 1000);  // also ages working → idle
setInterval(() => dirty && (render(), dirty = false), 200);

const { default: def, sessions } = await (await fetch('/api/sessions')).json();
const picker = $('picker'), chosen = new URLSearchParams(location.search).get('session') || def;
for (const s of sessions) picker.add(new Option(`${s.project.replace(/^-home-[^-]+-/, '~/').replace(/-/g, '/')} · ${s.id.slice(0, 8)} · ${new Date(s.mtime).toLocaleString()}`, s.path));
if (!sessions.some(s => s.path === chosen)) picker.add(new Option(chosen, chosen), 0);
picker.value = chosen;
picker.onchange = () => connect(picker.value);
connect(chosen);
</script>
</body>
</html>
