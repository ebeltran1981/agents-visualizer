  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" stroke="#2c332c" stroke-width="4"/>

  <!-- links: side boxes and diagonal agents to the app box -->
  <g stroke-width="12" stroke-linecap="round" opacity="0.75">
    <line x1="512" y1="382" x2="512" y2="275" stroke="#6ad8f3"/>
    <line x1="642" y1="512" x2="749" y2="512" stroke="#f3c76a"/>
    <line x1="512" y1="642" x2="512" y2="749" stroke="#f36ad8"/>
    <line x1="382" y1="512" x2="275" y2="512" stroke="#6ad8f3"/>
    <g stroke="#b6f36a" stroke-dasharray="2 22">
      <line x1="392" y1="392" x2="318" y2="318"/>
      <line x1="632" y1="392" x2="706" y2="318"/>
      <line x1="392" y1="632" x2="318" y2="706"/>
      <line x1="632" y1="632" x2="706" y2="706"/>
