    <rect x="779" y="499" width="60" height="10" rx="5"/><rect x="779" y="519" width="38" height="10" rx="5"/>
    <rect x="482" y="796" width="60" height="10" rx="5"/><rect x="482" y="816" width="38" height="10" rx="5"/>
    <rect x="185" y="499" width="60" height="10" rx="5"/><rect x="185" y="519" width="38" height="10" rx="5"/>
  </g>

  <!-- little agents -->
  <g>
    <g transform="translate(290 290)"><circle r="40" fill="#b6f36a"/><circle cx="-14" cy="-4" r="7" fill="#0b0d0c"/><circle cx="14" cy="-4" r="7" fill="#0b0d0c"/><rect x="-3" y="-58" width="6" height="18" rx="3" fill="#b6f36a"/></g>
    <g transform="translate(734 290)"><circle r="40" fill="#b6f36a"/><circle cx="-14" cy="-4" r="7" fill="#0b0d0c"/><circle cx="14" cy="-4" r="7" fill="#0b0d0c"/><rect x="-3" y="-58" width="6" height="18" rx="3" fill="#b6f36a"/></g>
    <g transform="translate(290 734)"><circle r="40" fill="#b6f36a"/><circle cx="-14" cy="-4" r="7" fill="#0b0d0c"/><circle cx="14" cy="-4" r="7" fill="#0b0d0c"/><rect x="-3" y="-58" width="6" height="18" rx="3" fill="#b6f36a"/></g>
    <g transform="translate(734 734)"><circle r="40" fill="#b6f36a"/><circle cx="-14" cy="-4" r="7" fill="#0b0d0c"/><circle cx="14" cy="-4" r="7" fill="#0b0d0c"/><rect x="-3" y="-58" width="6" height="18" rx="3" fill="#b6f36a"/></g>
