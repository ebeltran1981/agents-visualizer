    <rect x="466" y="520" width="34" height="90" rx="8" opacity="0.8"/>
    <rect x="514" y="480" width="34" height="130" rx="8"/>
    <rect x="562" y="535" width="34" height="75" rx="8" opacity="0.7"/>
