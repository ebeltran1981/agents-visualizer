  <line x1="389" y1="440" x2="635" y2="440" stroke="#b6f36a" stroke-width="6" opacity="0.5"/>
  <circle cx="420" cy="412" r="9" fill="#f36a6a"/>
  <circle cx="448" cy="412" r="9" fill="#f3c76a"/>
  <circle cx="476" cy="412" r="9" fill="#b6f36a"/>
  <g fill="#b6f36a">
